<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190" viewBox="0 0 380 190" font-family="'Segoe UI', sans-serif">

  <!-- Soft background -->
  <rect width="380" height="190" rx="14" fill="#f4f6fb"/>

  <!-- Title -->
  <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7a99" letter-spacing="1">P/Invoke Interop</text>

  <!-- C# Program box -->
  <rect x="20" y="38" width="160" height="124" rx="10" fill="#ddeeff" stroke="#7aaddd" stroke-width="1.5"/>
  <rect x="20" y="38" width="160" height="28" rx="10" fill="#7aaddd"/>
  <rect x="20" y="52" width="160" height="14" fill="#7aaddd"/>
  <text x="100" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C# Client Program</text>

  <!-- C# code lines -->
  <text x="28" y="84"  font-size="8.5" fill="#2a4a70" font-family="'Consolas','Courier New',monospace">static void Main()</text>
  <text x="28" y="97"  font-size="8.5" fill="#2a4a70" font-family="'Consolas','Courier New',monospace">{</text>
  <text x="38" y="110"  font-size="8.5" fill="#2a4a70" font-family="'Consolas','Courier New',monospace">  int a = 2, b = 3;</text>
  <text x="38" y="123" font-size="8.5" fill="#1a6e3c" font-family="'Consolas','Courier New',monospace" font-weight="bold">  NativeMethods.Sum(a, b);</text>
  <text x="38" y="136" font-size="8.5" fill="#2a4a70" font-family="'Consolas','Courier New',monospace">  Console.WriteLine(...);</text>
  <text x="28" y="149" font-size="8.5" fill="#2a4a70" font-family="'Consolas','Courier New',monospace">}    </text>

  <!-- C Library box -->
  <rect x="250" y="38" width="110" height="124" rx="10" fill="#e8f5e9" stroke="#7ac47a" stroke-width="1.5"/>
  <rect x="250" y="38" width="110" height="28" rx="10" fill="#7ac47a"/>
  <rect x="250" y="52" width="110" height="14" fill="#7ac47a"/>
  <text x="305" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C++ Library (.dll)</text>

  <!-- C code lines -->
  <text x="260" y="84"  font-size="8.5" fill="#1a4a2a" font-family="'Consolas','Courier New',monospace">int __cdecl</text>
  <text x="260" y="97"  font-size="8.5" fill="#1a6e3c" font-family="'Consolas','Courier New',monospace" font-weight="bold">Sum(int x, int y)</text>
  <text x="260" y="110" font-size="8.5" fill="#1a4a2a" font-family="'Consolas','Courier New',monospace">{</text>
  <text x="270" y="123" font-size="8.5" fill="#1a4a2a" font-family="'Consolas','Courier New',monospace">  return x + y;</text>
  <text x="260" y="136" font-size="8.5" fill="#1a4a2a" font-family="'Consolas','Courier New',monospace">}</text>

  <!-- Call arrow (→) -->
  <line x1="180" y1="100" x2="250" y2="100" stroke="#e07b3a" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="250,96 260,100 250,104" fill="#e07b3a"/>
  <text x="215" y="94" text-anchor="middle" font-size="8" fill="#e07b3a" font-weight="600">call</text>

  <!-- Return arrow (←) -->
  <line x1="250" y1="130" x2="180" y2="130" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="180,126 170,130 180,134" fill="#9b59b6"/>
  <text x="215" y="124" text-anchor="middle" font-size="8" fill="#9b59b6" font-weight="600">return int</text>

  <!-- Footer label -->
  <text x="200" y="180" text-anchor="middle" font-size="9" fill="#aab0c0">P/Invoke · cdecl calling convention</text>

</svg>
